<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#131a33" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Sky Ninja Academy — a slice-the-answer maths and writing game for Reception, Year 1 and Year 2 (EYFS & KS1)." />
  <title>Sky Ninja Academy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23131a33'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%233ec9ff' font-weight='700'%3E忍%3C/text%3E%3C/svg%3E" />
  <!-- #15: the manifest link is also the switch that turns the service worker on (src/pwa.ts). The
       single-file build strips it, because that page has no worker beside it. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <!-- #15 Part B: Safari never reads the manifest's icons, so the iOS home screen needs its own PNG or it
       screenshots the page instead. Stripped by scripts/bundle-single.mjs along with the manifest link,
       because the single-file page is hosted on somebody else's origin with no icons/ beside it. -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
