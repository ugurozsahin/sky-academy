# Turns the review convention into a red check, so a blocked PR is impossible to miss.
#
# Why this exists: one GitHub token serves the owner and every agent, so every PR looks self-authored and the
# API refuses a formal CHANGES_REQUESTED review (422). A reviewer therefore blocks a PR with two marks —
# it converts the PR to a **draft** and posts a comment beginning `REVIEW: CHANGES REQUESTED`. Those marks
# were only a convention: a merging agent that did not read them merged straight over the review, which is
# how ugurozsahin/sky-academy-private-archive#74 went in with five open review items. This job reads them and stamps the status red, and "never merge
# a PR whose CI is not green" is already the first rule of every merge — so the review now rides on a rule
# that is obeyed. The job itself stays green; see the note below.
#
# The two markers are matched asymmetrically, and scripts/review-gate.mjs explains why at length: a false
# positive on the block is red and self-correcting, a false positive on the clear silently lifts a real block.
#
# Read the STATUS, never this workflow's run conclusion: the run is green whether or not it found a block.
#
# Clearing a block: the reviewer who set it posts `REVIEW: CLEARED` and marks the PR ready for review.
# Nobody clears their own block, and pushing a fix does not clear it — that is the point of a review.
#
# It DOES run on `synchronize`, and must: a commit status belongs to one SHA, so a push to a blocked PR
# produces a head carrying no `review-gate` status at all. Without this trigger the push would not preserve
# the block, it would delete the evidence of it (ugurozsahin/sky-academy-private-archive#95 review). The block itself is comment-driven, so
# re-stamping the new head simply re-applies it.
#
# Cost: the job is skipped for comments that open with neither marker (a skipped job bills nothing), so this
# is about a minute per PR event and per REVIEW:/OWNER: comment. `labeled`/`unlabeled` are in the trigger list
# because a label — `owner-approval`, or `loosening` since #112 — is what puts a PR into the owner's hands — without them the label changes
# nothing, the status stays green, and an unapproved new look merges. Labels move rarely on a PR, so the added
# cost is small; the alternative is a rule that silently does not exist.
#
# `edited`/`deleted` (#77): `created` alone means editing or deleting a marker comment never re-stamps the
# status, so it can outlive the comment it was computed from. Withdrawing a block that way is harmless (the
# stale state is the blocked one, and something else eventually re-stamps it), but the mirror image is not:
# the owner writes `OWNER: APPROVED`, the gate goes green, he edits the comment to take it back — nothing
# re-triggers, and the next merge rule reads a verdict that no longer exists. The job always re-lists the PR's
# *current* comments before deciding (see the script below), so it does not need to know what changed — it
# only needs to be woken. A schedule was considered and rejected: it would need code to enumerate open PRs,
# bill minutes for doing nothing, and still leave a window, where the event is precise and immediate.
name: Review gate
on:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
permissions:
  contents: read             # checkout, for the predicate module
  statuses: write            # writes the `review-gate` status onto the PR head
  pull-requests: read
  issues: read
jobs:
  gate:
    # #232 — concurrency lives HERE, on the job, not on the workflow. A workflow-level group is claimed when the
    # run is queued, before the job's `if:` below is looked at, so a comment with no marker (whose job is then
    # skipped and writes nothing) still took the group's one pending slot and could evict a marker-bearing run.
    # A job that its `if:` skips is never queued, so it never touches the group. Docs: "Use `concurrency` to
    # ensure that only a single job or workflow using the same concurrency group will run at a time" and
    # "By default, any existing `pending` job or workflow in the same concurrency group will be canceled and the
    # new queued job or workflow will take its place" (workflow-syntax and using-concurrency pages). The docs
    # give job-level the same behaviour as workflow-level and do NOT spell out the skipped-job case, so that
    # half is reasoning, not a quotation, and only a live run can show it (tests/unit/review-gate-concurrency.test.ts
    # holds the YAML shape, not GitHub's scheduler).
    #
    # The two scenarios, and why a marker run can no longer be dropped:
    #  * #92 — an ordinary comment lands while a `synchronize` run is stamping. `cancel-in-progress: false`
    #    leaves the running run alone; the comment's job is skipped, so it never enters the group at all.
    #  * #232 — `synchronize` running; `OWNER: APPROVED` pending; then an unrelated comment. Before: the comment's
    #    run evicted the pending approval run, `synchronize` stamped a pre-approval status, and the comment's
    #    own job was skipped, so nothing re-stamped. Now: the unrelated comment's job is skipped and never
    #    queues, so the approval run keeps the pending slot and runs after `synchronize`.
    # What stays true: the group still holds one running and one pending job, so two MARKER-bearing events behind
    # a running job still cancel the first of them. That is safe: every run re-lists the PR's live comments right
    # before it writes (see the script), so the surviving, newest run computes a state that includes both markers.
    # Direction: TIGHTENING. A marker-bearing run can only be lost to another marker-bearing run that supersedes it.
    concurrency:
      # Two events in quick succession (comment, then Ready for review) must not race to stamp opposite states.
      group: review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
      # #92: this used to be `true`: the cancelling run stamped nothing, leaving the head with no `review-gate`
      # status at all, the gap docs/REVIEWER-PROMPT.md tells a reviewer to check for by hand. Queuing never loses
      # the information (see above): whichever run executes last writes what matches reality at that moment.
      cancel-in-progress: false
    # Ordinary conversation must not spend a runner minute: only REVIEW: comments on a PR wake this up.
    # `contains`, not `startsWith`: a marker preceded by a blank line or a quote would not have woken the job,
    # and a block nobody evaluates publishes as green. Cheap to wake on a false positive, costly to miss one.
    # Only a comment that *opens* with a marker wakes this, not one that merely mentions it: GitHub bills a
    # whole minute per job however briefly it runs, and matching anywhere in the body cost 22 minutes a day —
    # more than the nightly full suite — because the process quotes its own markers constantly.
    # Safe to narrow *for the REVIEW markers*: blocking also requires the draft toggle and clearing requires
    # "Ready for review", both `pull_request` events, so one of those always re-stamps — the comment trigger
    # only makes it sooner.
    #
    # The OWNER markers get `contains`, deliberately asymmetric, because the owner's verdict carries no such
    # companion event: if a comment typed after a blank line does not wake the job, his approval sits unread
    # and the PR stays red until something else happens. He is a person writing a sentence, not an agent
    # following a format, and he must not have to know that. The cost is bounded because his verdicts are rare
    # — a few a week against dozens of REVIEW comments a day, which is what made the wide filter expensive.
    #
    # #77 — an `edited` payload carries the comment's *current* (post-edit) body in `comment.body`, so the
    # checks above alone wake the job when a marker is typed IN by an edit but miss the opposite: a marker
    # edited OUT never matches the current body, even though that is exactly the case that must re-stamp
    # (an approval withdrawn this way must turn the gate red again). `changes.body.from` carries the body as
    # it stood *before* the edit, so the same four checks run against it too, but only for `edited` — `from`
    # is absent on `created`/`deleted` and `&&` short-circuits before GitHub Actions would evaluate it.
    # `deleted` needs no extra clause: its payload still carries the deleted comment in `comment.body` (the
    # note atop `scripts/review-gate.mjs`'s call below explains why re-listing comments after it is gone is
    # exactly what should happen), so the plain checks already wake the job when a marker comment is removed.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request != null &&
       (startsWith(github.event.comment.body, 'REVIEW:') ||
        startsWith(github.event.comment.body, '**REVIEW:') ||
        startsWith(github.event.comment.body, '> REVIEW:') ||
        contains(github.event.comment.body, 'OWNER:') ||
        (github.event.action == 'edited' &&
         (startsWith(github.event.changes.body.from, 'REVIEW:') ||
          startsWith(github.event.changes.body.from, '**REVIEW:') ||
          startsWith(github.event.changes.body.from, '> REVIEW:') ||
          contains(github.event.changes.body.from, 'OWNER:')))))
    runs-on: ubuntu-24.04   # pinned, not ubuntu-latest: that label moves to 26.04 from 2026-10-19 (#2085)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5          # for scripts/review-gate.mjs, the tested predicate
        with: { sparse-checkout: scripts/review-gate.mjs, sparse-checkout-cone-mode: false }
      - uses: actions/github-script@v8
        with:
          script: |
            const number = context.eventName === 'issue_comment'
              ? context.payload.issue.number
              : context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state !== 'open') { core.info(`#${number} is ${pr.state} — nothing to gate.`); return; }

            // Always the PR's comments as they stand RIGHT NOW, never the webhook payload's snapshot of one
            // comment — a `deleted` event's own payload still carries the removed comment, but it is already
            // gone from this listing, which is exactly what #77 needs: the state computed below reflects the
            // edit or delete that woke this run, whichever trigger it was. That also settles the rapid
            // create-then-edit race `concurrency:` above raises: since #92, the group queues rather than
            // cancels, so every triggered run for a PR reaches this point and writes — and because each one
            // re-lists live rather than trusting its own event, whichever run's write actually lands last on
            // the API side reflects everything that had happened by the time it queried GitHub, so an earlier
            // run's write (if it got this far) is superseded by fresher data, not raced against.
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number: number, per_page: 100 });
            // The decision lives in scripts/review-gate.mjs so tests/unit/review-gate.test.ts can hold it to
            // both directions — it has published green over a live block twice, and inline YAML cannot be tested.
            const { blockState } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/review-gate.mjs`);
            // Pass the comments whole: blockState() reads each one's `author_association` to decide whether its
            // marker counts (#215). Trimming them to {body, created_at} here would make every marker a stranger's.
            const { blocked, reasons } = blockState({ draft: pr.draft, labels: pr.labels.map(l => l.name), comments });

            const description = blocked ? `Blocked: ${reasons.join('; ')}`.slice(0, 140) : 'No open review block';
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: pr.head.sha, context: 'review-gate',
              state: blocked ? 'failure' : 'success',
              description,
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });
            // The RUN stays green even when the gate blocks. The signal is the `review-gate` status, which is
            // red on the PR and is what the merge rule reads; failing the job as well only sent the owner a
            // "run failed" email for every block, every re-block and every push to a blocked PR. Training him
            // to ignore failure mail is the opposite of what a gate is for — the next one would be a real
            // regression. A blocked PR is loud where it matters (the PR's own checks) and quiet in his inbox.
            core.notice(`#${number}: ${description}`);
            if (blocked) core.warning(
              `${description}. The reviewer who set the block clears it with a REVIEW: CLEARED comment and ` +
              `"Ready for review" — pushing a fix does not clear it.`);
