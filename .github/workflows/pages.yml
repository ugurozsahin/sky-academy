# Deploys the site to GitHub Pages (#1933): website/ at `/`, the game built with base /play/ at `/play/`.
# `npm run build` is unchanged (Android still embeds a root-based dist/). One-off owner steps: docs/WEBSITE.md.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false   # let a running deployment finish; GitHub keeps only the newest queued one
jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'   # the owner turns this on after enabling Pages (docs/WEBSITE.md step 2); until then main stays green
    runs-on: ubuntu-24.04   # pinned, not ubuntu-latest: that label moves to 26.04 from 2026-10-19 (#2085)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build the game for /play/
        run: npx tsc --noEmit && npx vite build --base=/play/ --outDir site/play --emptyOutDir && node scripts/build-sw.mjs site/play
      - name: Add the site pages, CNAME and .nojekyll
        run: cp -a website/. site/
      - name: Android App Links file (#2028; none until the owner sets ANDROID_APP_LINKS_SHA256)
        run: node scripts/app-links.mjs site
        env:
          ANDROID_APP_LINKS_SHA256: ${{ vars.ANDROID_APP_LINKS_SHA256 }}
      # #2088/#1935: the pages' screenshots are made here, from the site just assembled, and never committed.
      - name: Drop the apt sources we do not use (#85)
        run: sudo rm -fv /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
      - name: Install Chromium for the screenshots
        run: npx playwright install --with-deps chromium
      - name: Screenshots into site/img (#2088)
        run: |
          python3 -m http.server 4173 --directory site >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/play/ >/dev/null && break; sleep 1; done
          node scripts/site-shots.mjs http://localhost:4173/play/ site/img
      - uses: actions/upload-pages-artifact@v5
        # v4 dropped every dotfile with no way back, so .well-known/assetlinks.json never shipped (#2085)
        with: { path: site, include-hidden-files: true }
  deploy:
    needs: build   # skipped with it while PAGES_ENABLED is unset
    runs-on: ubuntu-24.04   # pinned, not ubuntu-latest: that label moves to 26.04 from 2026-10-19 (#2085)
    timeout-minutes: 10
    permissions:
      pages: write       # deploy-pages publishes the artifact
      id-token: write    # and proves where it came from
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
  check:
    needs: deploy   # skipped with it while PAGES_ENABLED is unset; nothing needs this job, so a failure turns this run red and blocks no PR (#2029)
    runs-on: ubuntu-24.04   # pinned, not ubuntu-latest: that label moves to 26.04 from 2026-10-19 (#2085)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: The .well-known files answer as the platforms need (#2029)
        run: |
          for i in 1 2 3 4; do
            node scripts/check-well-known.mjs https://sharpwise.co.uk && exit 0
            sleep 30   # the CDN and a fresh certificate can lag the deploy by a minute
          done
          exit 1
        env:
          ANDROID_APP_LINKS_SHA256: ${{ vars.ANDROID_APP_LINKS_SHA256 }}
