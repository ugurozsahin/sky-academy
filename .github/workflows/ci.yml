# The gate for every change. A pull request gets unit tests + guard rails, build, and e2e on the MOBILE
# project only (#141). A push to main gets the LIGHT run — that tree already passed e2e on its own PR minutes
# earlier, so main only re-checks what a merge can break cheaply (types, unit, build). The FULL matrix —
# every project — runs against main once a night, which is what catches two PRs that were green apart and
# broken together, and is now also the only place a desktop-only regression is caught. Docs-only changes run
# nothing. Clearing a review block (undrafting a PR) re-runs the suite — see the trigger note below (#159).
#
# Why the split: this is a private repo, so Actions minutes are metered (2,000/month on Free, 3,000 on Pro).
# Measured 2026-09-07 — full run ~12 min, light run ~3 min, and shipping one issue used to cost ~42 min
# because the same tree was tested on the PR and again on main, and the APK rebuilt on top of that.
name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.claude/**', '.gitignore']
  pull_request:
    # An explicit `types:` REPLACES GitHub's default list, it does not extend it, so the three defaults are
    # restated here. Drop one of them from this line and CI silently stops running on that event — losing
    # `synchronize` would mean a push to a pull request tests nothing at all. The rail in
    # tests/unit/guardrails.test.ts asserts all four by name.
    #
    # The fourth one is #159's fix. A review blocks a merge here by converting the PR to a DRAFT, and the
    # reviewer clears the block by marking it ready for review (CLAUDE.md, review-gate.yml) — a transition
    # that is not in GitHub's default list. So the protocol's own happy path (block, draft, author fixes,
    # reviewer clears, merge) ended on whatever run last happened, however old. On #150 that was a tick from
    # 03:31Z read at 12:37Z: nine hours and four merges of `main` later, one of which (#155) had rewritten
    # the very e2e helpers that PR's new guard rail called. The tick was green about a tree nobody was
    # proposing to merge, and the reviewing run merged while saying it was waiting for a re-run that could
    # not arrive. A stale tick is absence wearing a green tick.
    # Subscribing fixes it because a pull_request run tests `refs/pull/N/merge` — the head merged with `main`
    # AS OF THE RUN — so re-running the moment the block is cleared is evidence about the tree that lands.
    #
    # Cost, measured 2026-09-10, because #119 is watching this number: 17 undraft events in the 4.2 days to
    # 09-10 (~29/week, or ~18/week once PR #95's six block/clear cycles are set aside as the outlier they
    # are), against a pull-request run that costs ~4.0 min of wall clock now that #141 has landed — the four
    # most recent were 4.45, 4.0, 3.7 and 4.1 min. That is ~70-115 min/week, about a fifth of the ~600
    # min/week #141 itself just saved, and it is paid ONLY on pull requests a reviewer actually blocked.
    # The concurrency group below absorbs the overlap rather than adding to it: an undraft arriving while a
    # `synchronize` run for the same pull request is still going cancels that run instead of queueing beside
    # it. Draft pull requests already run CI on `opened` and `synchronize` — GitHub does not skip drafts —
    # so this adds one run per block cleared, not a run per draft.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md', 'docs/**', '.claude/**', '.gitignore']
  schedule:
    - cron: '20 3 * * *'      # 03:20 UTC: the nightly full run against main
  workflow_dispatch:           # …and a full run on demand, from any branch
concurrency:
  # Keyed on the event too: a merge landing while the nightly is mid-run must not cancel it — a cancelled
  # run reports nothing, so the one full check on main would vanish silently.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Unit tests + guard rails
        run: npm test
      - run: npm run build          # `tsc --noEmit && vite build` — the typecheck lives here
      # Everything below is the full run only: pull_request, the nightly schedule, or workflow_dispatch.
      # `--with-deps` runs `apt-get update` before it installs Playwright's system libraries, and the
      # ubuntu-latest image ships Google's chrome-stable source in its apt list. On 2026-09-09 that
      # repository served a Release file and a package index whose hashes disagreed; apt exited 100, the
      # step died, and every job on this repo failed there for hours (#147) — pull requests and the nightly
      # alike, each still paying for checkout, npm ci, unit tests and the build before dying.
      # We install Chromium THROUGH Playwright and never install Google Chrome, so that repository is not a
      # dependency of this project in any sense: dropping it takes a third party off our critical path.
      # Deliberately not `apt-get update || true`, which would fix this outage by making every apt failure
      # invisible, a real one included. Other vendor sources in the image can break the same way; this
      # removes the one that has.
      - name: Drop the apt sources we do not use (#147)
        if: github.event_name != 'push'
        run: sudo rm -fv /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
      - name: Install Playwright browsers
        if: github.event_name != 'push'
        run: npx playwright install --with-deps chromium
      # #141: a pull request runs the MOBILE project only; the nightly and workflow_dispatch run the whole
      # matrix. The game is mobile-first and the owner plays it on a phone and a tablet, so a desktop-only
      # regression landing on main and being caught by that night's run is the accepted trade.
      #
      # Why a project costs a whole run rather than a share of one: Playwright's `workers` defaults to half
      # the logical cores and an ubuntu-latest runner has 2, so this suite runs on ONE worker — the e2e step
      # prints `Running 78 tests using 1 worker`. Projects therefore run end to end, one after another, and
      # the desktop leg is the slower of the two (1280x800 against the iPhone 13 viewport). Measured on run
      # 34461649267: mobile 09:38:24 -> 09:41:07 (2m43s), desktop 09:41:07 -> 09:45:07 (4m00s), 6.8 m total.
      # Dropping desktop from the PR run therefore takes ~4.0 min off it, not the ~half a project count
      # suggests — and #116's third project will add its own full leg to the nightly for the same reason.
      #
      # A failing nightly is not silent: the watchdog task reads `?branch=main&event=schedule` every 6 hours
      # and opens a `watchdog` issue on a failure OR on no run in 26 hours (docs/WATCHDOG-PROMPT.md step 2),
      # and the dev routine re-checks it every 2 hours and treats a red nightly as that run's first work
      # (docs/ROUTINE-PROMPT.md STEP 1). Both read a conclusion, never an absence.
      - name: End-to-end (${{ github.event_name == 'pull_request' && 'mobile' || 'full matrix' }})
        if: github.event_name != 'push'
        run: npx playwright test ${{ github.event_name == 'pull_request' && '--project=mobile' || '--project=mobile --project=desktop' }}
      - if: failure() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces      # `reporter: list` writes no HTML report; the traces live here
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
