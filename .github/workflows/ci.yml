# The gate for every change. A pull request gets unit tests + guard rails and the build ALWAYS, and e2e on
# the MOBILE project only (#81) and only when the diff can actually reach the game (#96). A push to main
# gets the LIGHT run — that tree already passed e2e on its own PR minutes earlier, so main only re-checks
# what a merge can break cheaply (types, unit, build). The FULL matrix — every project — runs against main
# once a night, which is what catches two PRs that were green apart and broken together, and is now also the
# only place a desktop-only regression is caught. Clearing a review block (undrafting a PR) re-runs the
# suite — see the trigger note below (#88).
#
# Why the split: this is a private repo, so Actions minutes are metered (2,000/month on Free, 3,000 on Pro).
# Measured 2026-09-07 — full run ~12 min, light run ~3 min, and shipping one issue used to cost ~42 min
# because the same tree was tested on the PR and again on main, and the APK rebuilt on top of that.
name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.claude/**', '.gitignore']
  pull_request:
    # An explicit `types:` REPLACES GitHub's default list, it does not extend it, so the three defaults are
    # restated here. Drop one of them from this line and CI silently stops running on that event — losing
    # `synchronize` would mean a push to a pull request tests nothing at all. The rail in
    # tests/unit/guardrails.test.ts asserts all four by name.
    #
    # The fourth one is #88's fix. A review blocks a merge here by converting the PR to a DRAFT, and the
    # reviewer clears the block by marking it ready for review (CLAUDE.md, review-gate.yml) — a transition
    # that is not in GitHub's default list. So the protocol's own happy path (block, draft, author fixes,
    # reviewer clears, merge) ended on whatever run last happened, however old. On ugurozsahin/sky-academy-private-archive#150 that was a tick from
    # 03:31Z read at 12:37Z: nine hours and four merges of `main` later, one of which (ugurozsahin/sky-academy-private-archive#155) had rewritten
    # the very e2e helpers that PR's new guard rail called. The tick was green about a tree nobody was
    # proposing to merge, and the reviewing run merged while saying it was waiting for a re-run that could
    # not arrive. A stale tick is absence wearing a green tick.
    # Subscribing fixes it because a pull_request run tests `refs/pull/N/merge` — the head merged with `main`
    # AS OF THE RUN — so re-running the moment the block is cleared is evidence about the tree that lands.
    #
    # Cost, measured 2026-09-10, because #74 is watching this number: 17 undraft events in the 4.2 days to
    # 09-10 (~29/week, or ~18/week once PR ugurozsahin/sky-academy-private-archive#95's six block/clear cycles are set aside as the outlier they
    # are), against a pull-request run that costs ~4.0 min of wall clock now that #81 has landed — the four
    # most recent were 4.45, 4.0, 3.7 and 4.1 min. That is ~70-115 min/week, about a fifth of the ~600
    # min/week #81 itself just saved, and it is paid ONLY on pull requests a reviewer actually blocked.
    # The concurrency group below absorbs the overlap rather than adding to it: an undraft arriving while a
    # `synchronize` run for the same pull request is still going cancels that run instead of queueing beside
    # it. Draft pull requests already run CI on `opened` and `synchronize` — GitHub does not skip drafts —
    # so this adds one run per block cleared, not a run per draft.
    types: [opened, synchronize, reopened, ready_for_review]
    # DELIBERATELY no `paths-ignore` here (#96). It used to carry the same list as `push` above, which meant
    # a docs-only pull request produced NO `CI` check at all — and the merge rules then need a carve-out
    # saying that particular absence is fine, sitting next to a rule saying an absent check is a red light.
    # Two readings of the same missing tick is how ugurozsahin/sky-academy-private-archive#150 was merged. Worse, the guard rails ARE documentation
    # checks: tests/unit/guardrails.test.ts asserts that CLAUDE.md and docs/ROUTINE-PROMPT.md
    # agree and that the freeze lift still reads as one-time, so a pull request touching only those files is
    # exactly the change those rails exist to catch, and it was the one shape they never ran on.
    # The e2e step below is what gets filtered instead, so the saving is kept and the check is not.
    # `push` keeps its filter: that tree passed on its own pull request minutes earlier.
  schedule:
    - cron: '37 4 * * *'      # 04:37 UTC: the nightly full run against main. Moved off '20 3' (#141):
                              # GitHub delays/drops schedule events near round-number/top-of-hour
                              # times under load, and #141 measured '20 3' firing 4.5-5.5h late and
                              # drifting ~25-35 min later each day (confirmed again 2026-09-17: the
                              # first nightly on this migrated repo still fired ~5h20m late). ':37' is
                              # the same minute the dev routine's own cron already uses, for the same
                              # reason. If this still drifts, the problem is not the minute.
  workflow_dispatch:           # …and a full run on demand, from any branch
concurrency:
  # Keyed on the event too: a merge landing while the nightly is mid-run must not cancel it — a cancelled
  # run reports nothing, so the one full check on main would vanish silently.
  #
  # #206: a push additionally gets its own commit in the key. Without it, two merges to main land in the
  # same group (`ci-refs/heads/main-push`) whenever they are within the workflow's run time of each other —
  # PR #190 and PR #193 merged 3 seconds apart on 2026-09-17 and the second push's `cancel-in-progress`
  # killed the first's still-running check, which reports nothing rather than a failure. That first commit's
  # own tree was never actually checked; it only turned out fine because #193 happened to be a fast-follow
  # rebased on top of it. A genuinely broken merge landing the same way would go straight from "cancelled" to
  # "nobody looks" — the failure mode `push`'s green ticks are the only defence against, since main gets no
  # pull-request run of its own. Folding `github.sha` into a push's group makes every push's group unique, so
  # `cancel-in-progress` never fires between two pushes — it still fires within one PR's own `synchronize`
  # runs (`refs/pull/<n>/merge` is stable across those) and within the nightly/`workflow_dispatch` group,
  # which is the overlap this mechanism exists to absorb (#88).
  group: ci-${{ github.ref }}-${{ github.event_name }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The scope step below needs the merge base to diff against, and checkout's default depth of 1 does
          # not have it. Unconditionally, NOT `${{ … == 'pull_request' && 0 || 1 }}`: GitHub's `&&`/`||`
          # return the operand rather than a boolean, so that idiom silently collapses to `1` whenever the
          # "true" branch is falsy — `0` here — and the diff would fail on every pull request. It would fail
          # safe (the step then runs e2e), so nothing would go red; the filter would simply never once fire,
          # which is the kind of defect that gets shipped and believed. 52 commits and 5 MB of history, so a
          # full clone costs a fraction of a second and none of the ambiguity.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # #96: e2e is ~90% of this repo's Actions bill and much of it is paid on changes that cannot move a
      # pixel — the rails that enforce the documentation live in tests/unit/, so a governance pull request is
      # almost never docs-only and used to drag the whole suite along with it. This step decides, once, from
      # the pull request's real diff (three-dot, the same range GitHub's "Files changed" shows) whether the
      # change can reach the game. The unit tests and the build are NOT filtered and never will be: they cost
      # ~14 s, and they are the only check a documentation change has.
      #
      # Two properties this step must keep, both of them fail-safe:
      #   - anything that is not a pull request (the nightly, workflow_dispatch, a push) answers `true`
      #     without consulting the diff at all — the nightly is the one full check a merged tree gets;
      #   - if the diff cannot be computed for ANY reason (a missing base sha, a shallow clone, git exiting
      #     non-zero), it answers `true`. Skipping e2e because a git command failed would be a silent loss of
      #     coverage that looks exactly like a saving, which is the failure mode this whole file is written
      #     against — a stale tick and an absent one both read green.
      # GAME_PATHS is the load-bearing line and tests/unit/guardrails.test.ts reads it FROM HERE, so it must
      # stay a single-quoted one-liner. Adding a top-level directory under src/ that this regex does not
      # cover turns that rail red, which is the point: `src/` is a prefix so that it never can.
      - name: Can this change reach the game? (#96)
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          GAME_PATHS='^(src/|index\.html$|public/|tests/e2e/|playwright\.config\.|package(-lock)?\.json$|\.github/workflows/ci\.yml$)'
          if [ "$EVENT" != 'pull_request' ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            echo "sketch=false" >> "$GITHUB_OUTPUT"   # the full matrix below already carries the sketchbook project
            echo "### e2e: **running** — \`$EVENT\` is never filtered (#96)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! files=$(git diff --name-only "$BASE...$HEAD" 2>&1); then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            echo "sketch=true" >> "$GITHUB_OUTPUT"    # fails towards running, the same as e2e
            echo "### e2e: **running** — could not diff \`$BASE...$HEAD\`, so e2e is not skipped (#96)" >> "$GITHUB_STEP_SUMMARY"
            echo "$files"
            exit 0
          fi
          echo "changed files:"; echo "$files"
          # #715: the sketchbook's own paths (epic #713 decision 5). A file here runs the `sketchbook` Playwright
          # project; a file here that is ALSO a game path — `src/three/stage/`, `objects/`, `sketchbook/` sit
          # under `src/` — does not by itself run the game's e2e, because the game never imports them: the only
          # surface it reaches is `src/three/mount/`, which stays a game path and is deliberately NOT listed here.
          # Subtracted from the game list below, never from GAME_PATHS itself, so the coverage rail in
          # tests/unit/guardrails.test.ts still sees every `src/` directory covered, and a diff that touches
          # both the sketchbook and the game runs both.
          SKETCH_PATHS='^(src/three/(stage|objects|sketchbook)/|sketchbook\.html$|vite\.sketchbook\.config\.ts$|tests/sketch/|scripts/sketch-(shot|gallery)\.mjs$)'
          game=$(echo "$files" | grep -E "$GAME_PATHS" | grep -Ev "$SKETCH_PATHS" || true)
          if [ -n "$game" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            { echo "### e2e: **running** — the diff touches the game (#96)";
              echo "$game" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
            { echo "### e2e: **skipped** — nothing in this diff can reach the game (#96)";
              echo "Unit tests, guard rails and the build ran as always. Changed files:";
              echo "$files" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if echo "$files" | grep -Eq "$SKETCH_PATHS"; then
            echo "sketch=true" >> "$GITHUB_OUTPUT"
            { echo "### sketchbook: **running** — the diff touches the sketchbook (#715)";
              echo "$files" | grep -E "$SKETCH_PATHS" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "sketch=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Unit tests + guard rails
        run: npm test
      - run: npm run build          # `tsc --noEmit && vite build` — the typecheck lives here
      # Everything below is the full run only: pull_request, the nightly schedule, or workflow_dispatch.
      # `--with-deps` runs `apt-get update` before it installs Playwright's system libraries, and the
      # ubuntu-latest image ships Google's chrome-stable source in its apt list. On 2026-09-09 that
      # repository served a Release file and a package index whose hashes disagreed; apt exited 100, the
      # step died, and every job on this repo failed there for hours (#85) — pull requests and the nightly
      # alike, each still paying for checkout, npm ci, unit tests and the build before dying.
      # We install Chromium THROUGH Playwright and never install Google Chrome, so that repository is not a
      # dependency of this project in any sense: dropping it takes a third party off our critical path.
      # Deliberately not `apt-get update || true`, which would fix this outage by making every apt failure
      # invisible, a real one included. Other vendor sources in the image can break the same way; this
      # removes the one that has.
      # These two exist only to make e2e possible, so they carry e2e's own condition (#96) as well as the
      # push guard. Leaving them unfiltered would install a browser for a run that never opens one — about a
      # minute of the ~2.9 the filter is there to save.
      - name: Drop the apt sources we do not use (#85)
        if: github.event_name != 'push' && (steps.scope.outputs.e2e == 'true' || steps.scope.outputs.sketch == 'true')
        run: sudo rm -fv /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
      - name: Install Playwright browsers
        if: github.event_name != 'push' && (steps.scope.outputs.e2e == 'true' || steps.scope.outputs.sketch == 'true')
        run: npx playwright install --with-deps chromium
      # #81: a pull request runs the MOBILE project only; the nightly and workflow_dispatch run the whole
      # matrix. The game is mobile-first and the owner plays it on a phone and a tablet, so a desktop-only
      # regression landing on main and being caught by that night's run is the accepted trade.
      #
      # Why a project used to cost a whole run rather than a share of one — and #483's correction, because
      # the explanation this paragraph carried was the wrong cause and #81 was costed against it.
      # What it said: `workers` defaults to half the logical cores, an ubuntu-latest runner has 2, so the
      # suite runs on ONE worker and projects therefore run end to end. The observation was right and the
      # cause was not. A project was serial because `fullyParallel` was OFF in playwright.config.ts, which
      # parallelises across FILES only — and 97 of the mobile project's 104 tests are in one file, so extra
      # workers had nothing to pick up and idled. Run 35640634022 says `Running 107 tests using 2 workers`
      # (the runner is 4 cores now, not 2) and still paid 416 s, with worker 2 done after 57 s.
      # The flag is on as of #483, and it takes worker utilisation on this step from 56 % to 98-99 %. The
      # wall-clock win here is smaller than that sounds and noisier than a laptop suggests — 374/292/254 s
      # over three re-runs of one commit, against a twelve-run baseline of 340-437 s — because this runner is
      # CPU-bound: the same 107 tests cost 466 s of test time serially and 575-731 s two at a time. More
      # workers on ONE runner cannot go further; more runners (--shard) could, and that is #81's decision.
      # The desktop leg is still the slower of the two (1280x800 against the iPhone 13 viewport). Measured on
      # run 34461649267, BEFORE that flag and at one worker: mobile 2m43s, desktop 4m00s, 6.8 m total.
      # Dropping desktop from the PR run therefore takes ~4.0 min off it, not the ~half a project count
      # suggests — and #72's third project will add its own full leg to the nightly for the same reason.
      #
      # A failing nightly is not silent: the watchdog task reads `?branch=main&event=schedule` every 6 hours
      # and opens a `watchdog` issue on a failure OR on no run in 26 hours (docs/WATCHDOG-PROMPT.md step 2),
      # and the dev routine re-checks it every 2 hours and treats a red nightly as that run's first work
      # (docs/ROUTINE-PROMPT.md STEP 1). Both read a conclusion, never an absence.
      #
      # #96 adds the second half of the condition: the step is skipped, visibly and with its reason in the
      # run summary, when the pull request's diff cannot reach the game. The scope step above answers `true`
      # for every non-pull-request event and for any diff it could not compute, so the nightly and
      # workflow_dispatch are untouched by the filter — the one full check a merged tree gets is not
      # something a path list may take away.
      #
      # #72 adds `tablet` (800x1280) and `tablet-landscape` (1280x800) to the full matrix and NOT to the
      # pull-request arm. Nothing in CI had ever rendered a tablet, which is the shared blind spot behind
      # #63, #65 and #66; both projects are restricted in playwright.config.ts to tests/e2e/viewport.spec.ts,
      # 5 tests each, so the pair is ~16 s on a runner rather than the ~8 min two unrestricted legs would cost.
      # The pull-request arm stays at one project: putting a tablet on it is more metered minutes per pull
      # request, and that is #74's open decision, not a run's to take. The #81 rail holds both halves —
      # every declared project in the full arm, exactly one in the pull-request arm.
      - name: End-to-end (${{ github.event_name == 'pull_request' && 'mobile' || 'full matrix' }})
        if: github.event_name != 'push' && steps.scope.outputs.e2e == 'true'
        run: npx playwright test ${{ github.event_name == 'pull_request' && '--project=mobile' || '--project=mobile --project=desktop --project=tablet --project=tablet-landscape --project=sketchbook' }}
      # #715: a pull request whose diff touches the sketchbook runs its one spec — the screenshot script — as its
      # own step, on top of e2e when the diff also reaches the game and instead of it when it does not. Seconds,
      # not minutes: one page, a handful of frames. The nightly needs no step of its own: the full matrix above
      # already lists the `sketchbook` project (#141's rail holds every declared project in that arm).
      - name: Sketchbook screenshots (#715)
        if: github.event_name == 'pull_request' && steps.scope.outputs.sketch == 'true'
        run: npx playwright test --project=sketchbook
      - if: failure() && github.event_name != 'push'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces      # `reporter: list` writes no HTML report; the traces live here
          path: |
            test-results/
            docs/sketchbook/           # #715: a BLANK verdict is only arguable with the frame it was given on
          retention-days: 7
          if-no-files-found: ignore

  # #89 — the rule shows up in the head branch name, so that is what this reads.
  #
  # The unit rails in tests/unit/guardrails.test.ts can only check that the instruction files agree with each
  # other; they are green on a pull request whose own branch ignores the convention, which is exactly what
  # happened while the convention was being written. The owner asked for this one by name (issue #89,
  # 2026-09-10T18:12Z): "The guard rail this issue asks for should check the PR's head branch name, which is
  # where the rule actually shows up, not just that the docs agree with each other."
  #
  # `pull_request` only: a push to main, the nightly and workflow_dispatch have no head branch to judge, and
  # failing them on `main` would be nonsense. Costs a runner-second and needs no checkout.
  #
  # The ONE exception is the one the owner documented on that issue — a push the host REFUSES, not one a run
  # would rather not make. It is claimed by a line in the pull request body beginning `BRANCH: PUSH REFUSED`,
  # which then has to name the branch that was tried and quote the refusal, and it is deliberately loud: a
  # marker in the body is visible to every reviewer, where a silent fallback in a rule was not. Runs pushing
  # branches they name themselves is verified — a scheduled cloud run created and pushed
  # `chore/160-branch-naming-pushtest` on 2026-09-11 — so this marker should be rare enough that a second one
  # is worth investigating rather than accommodating.
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Head branch follows feature|fix|chore/<issue>-<slug> (#89)
        env:
          HEAD_REF: ${{ github.head_ref }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          PATTERN='^(feature|fix|chore)/[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'
          if printf '%s' "$HEAD_REF" | grep -Eq "$PATTERN"; then
            echo "### branch name: **ok** — \`$HEAD_REF\` (#89)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # grep, not a glob: the marker must start a line, so a reviewer quoting it in a sentence does not
          # clear the check the way a keyword buried in a body closes an issue (#83, the same class of bug).
          if printf '%s' "$BODY" | grep -Eq '^BRANCH: PUSH REFUSED'; then
            echo "### branch name: **exception claimed** — \`$HEAD_REF\` (#89)" >> "$GITHUB_STEP_SUMMARY"
            echo "The body carries \`BRANCH: PUSH REFUSED\`. A reviewer must check it names the branch that" >> "$GITHUB_STEP_SUMMARY"
            echo "was tried and quotes the refusal — this job cannot judge that, only that it was claimed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### branch name: **FAILED** — \`$HEAD_REF\` (#89)" >> "$GITHUB_STEP_SUMMARY"
          echo "Branches are named for the change: \`feature|fix|chore/<issue>-<slug>\` — \`fix/\` for" >> "$GITHUB_STEP_SUMMARY"
          echo "\`bug\`/\`playtest\`, \`feature/\` for \`enhancement\`, \`chore/\` for everything else." >> "$GITHUB_STEP_SUMMARY"
          echo "A run names its own branch; the branch a session was assigned is not to be used." >> "$GITHUB_STEP_SUMMARY"
          echo "If the push was REFUSED, say so on its own line in the body, starting \`BRANCH: PUSH REFUSED\`," >> "$GITHUB_STEP_SUMMARY"
          echo "naming the branch you tried and quoting the refusal." >> "$GITHUB_STEP_SUMMARY"
          exit 1
