# Gate for every pull request (and every push to main): typecheck, unit tests + guard rails, build, e2e.
# Until this existed the guard rails ran nowhere on a PR — they only fired after a merge, on the APK build,
# and the browser rails not at all (#73 review). A red job here is the signal not to merge.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Unit tests + guard rails
        run: npm test
      - run: npm run build          # `tsc --noEmit && vite build` — the typecheck lives here
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: End-to-end (mobile + desktop)
        run: npx playwright test --project=mobile --project=desktop
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces      # `reporter: list` writes no HTML report; the traces live here
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
