# Builds the Android APK (Capacitor wrapper, issue #53) on every push to main and on v* tags.
# Download: Actions → this run → "sky-ninja-academy-apk" artifact. A tag `vX.Y.Z` also attaches the APK to a GitHub Release.
name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['android/**', 'capacitor.config.ts', '.github/workflows/android.yml', 'package.json']   # web-only PRs skip the APK build; main always builds
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write          # the tag step attaches the APK to a GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Unit tests + typecheck
        run: npx tsc --noEmit && npm test
      - name: Web build
        run: npm run build
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Copy the web build into the Android project
        run: npx cap sync android
      - name: Stable debug signing key (optional secret ANDROID_DEBUG_KEYSTORE = base64 of a debug.keystore, password "android")
        if: ${{ env.KS != '' }}
        env: { KS: '${{ secrets.ANDROID_DEBUG_KEYSTORE }}' }
        run: mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sky-ninja-academy-${{ github.sha }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sky-ninja-academy-apk
          path: sky-ninja-academy-*.apk
          retention-days: 30
      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: sky-ninja-academy-*.apk }
